name: Save regression tests
on:
  pull_request:
    paths:
      - 'factory-empire/**'
      - 'factory-empire.test.cjs'
      - 'save-progress.test.cjs'
      - 'index.html'
      - 'service-worker.js'
      - '.github/workflows/save-tests.yml'
  push:
    branches: [main]
    paths:
      - 'factory-empire/**'
      - 'factory-empire.test.cjs'
      - 'save-progress.test.cjs'
      - 'index.html'
      - 'service-worker.js'
      - '.github/workflows/save-tests.yml'
permissions:
  contents: read
jobs:
  save-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node factory-empire.test.cjs
      - run: node save-progress.test.cjs
