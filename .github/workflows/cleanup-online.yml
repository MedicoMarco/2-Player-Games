name: Temporäre Online-Daten bereinigen

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play2gether-firebase-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref_name == github.event.repository.default_branch && vars.PLAY2GETHER_CLEANUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: node firebase/cleanup-online.cjs
        env:
          FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          CLEANUP_EMAIL: ${{ secrets.FIREBASE_CLEANUP_EMAIL }}
          CLEANUP_PASSWORD: ${{ secrets.FIREBASE_CLEANUP_PASSWORD }}
