<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sector 09 – Entwicklungsprototyp</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08111d;color:#e5f2fa;font:15px system-ui,sans-serif}button,select{font:inherit;color:inherit;background:#183447;border:1px solid #426b7d;border-radius:9px;padding:10px 16px;cursor:pointer}button:disabled{opacity:.4;cursor:default}header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid #263b50;gap:8px}header a{color:#82d8e8}main{max-width:1350px;margin:auto;padding:12px}h1,h2,p{margin:0 0 10px}h1{font-size:20px;letter-spacing:3px}.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px;background:#142436;border-radius:10px}.stage{position:relative;margin:10px 0;border:1px solid #38556a;border-radius:14px;overflow:hidden;background:#0c1623}canvas{display:block;width:100%;height:clamp(270px,60vh,650px);touch-action:none}.panel{padding:18px;background:#142436;border:1px solid #38556a;border-radius:14px;margin:10px 0}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#08121ddd;z-index:2;padding:10px}.overlay[hidden],[hidden]{display:none!important}.dialog{width:min(100%,480px);max-height:100%;overflow:auto;background:#14283a;border:1px solid #5991a7;border-radius:16px;padding:22px;box-shadow:0 12px 60px #0008}.actions,.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.hint{color:#91abbf;font-size:13px}.bar{width:120px;height:8px;border-radius:8px;background:#34495b;overflow:hidden;display:inline-block}.bar i{display:block;background:#65dfbd;height:100%;width:0}.touch{display:none;gap:6px;grid-template-columns:repeat(3,48px);justify-content:center}.touch button{padding:10px;touch-action:none;user-select:none}@media(pointer:coarse){.touch{display:grid}}.tag{color:#7ae8cd}.warn{color:#ffcf7c}
</style></head><body>
<header><h1>SECTOR 09</h1><a href="../index.html">Zur Spieleübersicht</a></header>
<main><section id="setup" class="panel"><h2>Orbitalstation – Testmission</h2><p>Reaktiviere die Forschungsstation. Eine Einheit hat eine geheime Gegenmission.</p><p class="hint">Entwicklungsstand 01 · lokaler Bot-Modus · Online-Anbindung noch nicht vorhanden.</p><label>Einheiten <select id="count"><option>4</option><option selected>6</option><option>8</option><option>10</option><option>12</option></select></label> <label>Rolle <select id="role"><option value="random">Zufall</option><option value="crew">Technik</option><option value="agent">Störsignal</option></select></label> <button id="start">Mission starten</button></section>
<section id="game" hidden><div class="hud"><span id="identity"></span><span id="area"></span><span id="progress"></span><span id="alarm"></span></div><div class="stage"><canvas id="screen" aria-label="2,5D Forschungsstation"></canvas><div class="overlay" id="overlay" hidden><div class="dialog"><h2 id="heading"></h2><p id="message"></p><div class="choices" id="choices"></div></div></div></div>
<div class="actions"><button id="use">Interagieren [E]</button><button id="signal">Störsignal [Q]</button><button id="disable">Deaktivieren [F]</button><button id="meet">Rat einberufen [R]</button><button id="quit">Zur Lobby</button></div><p id="hint" class="hint"></p>
<div class="touch"><span></span><button data-key="w">▲</button><span></span><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('screen'), ctx=canvas.getContext('2d');
const T=64, W=15,H=11;
const layout=[
'###############',
'#...#.....#...#',
'#...#.....#...#',
'#.............#',
'###.##.##.##.##',
'#.............#',
'#..##...##....#',
'#..##...##....#',
'#.............#',
'#....#...#....#',
'###############'
];
const rooms=[{name:'Sensorlabor',x:2,y:2},{name:'Leitstelle',x:7,y:2},{name:'Hydrokultur',x:12,y:2},{name:'Energiekern',x:2,y:7},{name:'Archiv',x:7,y:7},{name:'Werkstatt',x:12,y:7}];
const colors=['#5ed6df','#f6a75c','#a38af6','#73db97','#ee81a3','#e8cf60','#7da5ee','#c2e6e1','#b6c969','#f58a70','#9f9ac5','#d6dce7'];
const keys=new Set();let game=null,last=0,frame=0,cam={x:0,y:0,z:1},view={w:0,h:0},paused=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), tile=(x,y)=>({x:(x+.5)*T,y:(y+.5)*T});
const open=(x,y)=>layout[y]?.[x]==='.';
const walkable=(x,y)=>[-11,11].every(dx=>[-11,11].every(dy=>open(Math.floor((x+dx)/T),Math.floor((y+dy)/T))));
const move=(p,dx,dy)=>{if(walkable(p.x+dx,p.y))p.x+=dx;if(walkable(p.x,p.y+dy))p.y+=dy;};
const near=(p,items,r=75)=>items.filter(o=>dist(p,o)<r).sort((a,b)=>dist(p,a)-dist(p,b))[0];
const floor=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(open(x,y))floor.push({x,y});
function route(p,target){const a={x:Math.floor(p.x/T),y:Math.floor(p.y/T)},b={x:Math.floor(target.x/T),y:Math.floor(target.y/T)},key=o=>o.x+','+o.y,q=[a],prev=new Map([[key(a),null]]);for(let i=0;i<q.length;i++){let c=q[i];if(key(c)===key(b)){let path=[];while(prev.get(key(c))){path.unshift(tile(c.x,c.y));c=prev.get(key(c));}return path;}for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const n={x:c.x+dx,y:c.y+dy};if(open(n.x,n.y)&&!prev.has(key(n))){prev.set(key(n),c);q.push(n);}}}return [];}
function start(){const n=+$('count').value,role=$('role').value,agent=role==='agent'?0:role==='crew'?1+Math.floor(Math.random()*(n-1)):Math.floor(Math.random()*n);game={units:Array.from({length:n},(_,i)=>({id:i,name:i?'Einheit '+String(i+1).padStart(2,'0'):'Du',color:colors[i],...tile(2+i%10,3),agent:i===agent,active:true,path:[],wait:0,done:0,cool:10})),tasks:rooms.map((r,i)=>({...tile(r.x,r.y),name:r.name,type:i%3,done:false})),time:0,alarm:0,meetings:1,ended:false,notes:[],disabled:[],botMeeting:0};$('setup').hidden=true;$('game').hidden=false;paused=false;keys.clear();$('overlay').hidden=true;last=0;cancelAnimationFrame(frame);frame=requestAnimationFrame(loop);hud();}
function dialog(title,msg,buttons){paused=true;keys.clear();$('heading').textContent=title;$('message').textContent=msg;const box=$('choices');box.replaceChildren();for(const [label,fn] of buttons){let b=document.createElement('button');b.textContent=label;b.onclick=fn;box.append(b);}$('overlay').hidden=false;}
function closeDialog(){$('overlay').hidden=true;paused=false;keys.clear();}
function result(win,why){game.ended=true;dialog(win?'Mission gewonnen':'Mission verloren',why,[['Neue Mission',start],['Lobby',quit]]);}
function check(){if(game.ended)return;let agents=game.units.filter(p=>p.active&&p.agent),crew=game.units.filter(p=>p.active&&!p.agent);let side;if(!agents.length)side='crew';else if(agents.length>=crew.length)side='agent';else if(game.tasks.every(t=>t.done))side='crew';if(side)result((side==='agent')===game.units[0].agent,side==='crew'?'Die Station wurde gesichert.':'Das Störsignal hat die Mission unterbrochen.');}
function deactivate(actor,target){if(!actor.active||!target.active||!actor.agent||target.agent||actor.cool>0)return;target.active=false;actor.cool=17;game.disabled.push({x:target.x,y:target.y,reported:false,id:target.id});if(target.id===0)game.notes.push('Deine Einheit ist deaktiviert. Du kannst die Runde beobachten.');check();}
function meeting(reported){if(paused||game.ended)return;let p=game.units[0];if(!reported){if(!p.active||!game.meetings)return;game.meetings--;}let active=game.units.filter(u=>u.active);const options=p.active?active.filter(u=>u.id!==0).map(u=>[u.name,()=>resolveVote(u.id)]):[];options.push([p.active?'Enthalten':'Abstimmung beobachten',()=>resolveVote(-1)]);let report=game.notes.slice(-2).join(' · ');dialog('Stationsrat', (reported?'Eine deaktivierte Einheit wurde entdeckt. ':'Notfallbesprechung. ')+(report||'Es liegen noch keine sicheren Hinweise vor.')+' Welche Einheit soll die Mission verlassen?',options);}
function resolveVote(vote){let votes=new Map();if(vote>=0)votes.set(vote,1);const active=game.units.filter(u=>u.active);for(const b of active.filter(u=>u.id!==0)){let opts=active.filter(o=>o.id!==b.id);if(Math.random()<.27||!opts.length)continue;let pick=opts[Math.floor(Math.random()*opts.length)];votes.set(pick.id,(votes.get(pick.id)||0)+1);}let ranked=[...votes].sort((a,b)=>b[1]-a[1]),out=ranked[0]&&(!ranked[1]||ranked[0][1]>ranked[1][1])&&ranked[0][1]>active.length/2?game.units[ranked[0][0]]:null;if(out)out.active=false;game.disabled.forEach(d=>d.reported=true);game.notes=[];dialog('Abstimmung beendet',out?out.name+' verlässt die Mission. Rolle: '+(out.agent?'Störsignal':'Technik'):'Keine eindeutige Mehrheit.',[['Weiter',()=>{closeDialog();check();}]]);}
function task(t){let step=0;const target=[2,0,1].map((v,i)=>(v+t.type)%3);const labels=['◆ Impuls','● Resonanz','▲ Frequenz'];function show(){dialog(t.name,'Kalibrierung: '+target.map((v,i)=>i<step?'✓':labels[v]).join(' → '),[...labels.map((label,i)=>[label,()=>{step=i===target[step]?step+1:0;if(step===target.length){t.done=true;closeDialog();check();}else show();}]),['Abbrechen',closeDialog]]);}show();}
function use(){if(!game||paused||game.ended)return;let p=game.units[0];if(!p.active)return;const d=near(p,game.disabled.filter(d=>!d.reported));if(d){d.reported=true;meeting(true);return;}let t=near(p,game.tasks.filter(t=>!t.done));if(game.alarm&&near(p,[game.tasks[3]])){game.alarm=0;return;}if(t&&!p.agent)task(t);}
function signal(){if(!game||paused||game.ended)return;let p=game.units[0];if(p.active&&p.agent&&!game.alarm)game.alarm=25;}
function disable(){if(!game||paused||game.ended)return;let p=game.units[0];if(p.active&&p.agent){const target=near(p,game.units.filter(u=>u.active&&!u.agent),58);if(target)deactivate(p,target);}}
function quit(){cancelAnimationFrame(frame);game=null;paused=false;keys.clear();$('game').hidden=true;$('setup').hidden=false;$('overlay').hidden=true;}
function tick(dt){let p=game.units[0];game.time+=dt;for(let u of game.units)u.cool=Math.max(0,u.cool-dt);let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0),len=Math.hypot(dx,dy);if(len)move(p,dx/len*165*dt,dy/len*165*dt);if(game.alarm>0){game.alarm-=dt;if(game.alarm<=0){game.alarm=0;result(p.agent,'Die Systemstörung konnte nicht rechtzeitig behoben werden.');return;}}for(let b of game.units.slice(1)){if(!b.active)continue;let found=near(b,game.disabled.filter(d=>!d.reported),38);if(found&&!b.agent&&game.time>game.botMeeting){game.botMeeting=game.time+10;found.reported=true;meeting(true);return;}if(b.agent){let target=near(b,game.units.filter(u=>u.active&&!u.agent),38);if(target&&b.cool<=0){deactivate(b,target);if(game.ended)return;}if(!game.alarm&&game.time>25&&Math.random()<dt*.01)game.alarm=25;}else if(game.alarm&&near(b,[game.tasks[3]],35)){game.alarm=0;}if(b.wait>0){b.wait-=dt;continue;}if(!b.path.length){let t=!b.agent?near(b,game.tasks.filter(t=>!t.done),28):null;if(t&&!game.alarm){b.done++;if(b.done%2===0)t.done=true;b.wait=2.4;check();if(game.ended)return;}let candidates=game.tasks.filter(t=>!t.done),r=!b.agent&&game.alarm?game.tasks[3]:!b.agent&&candidates.length&&Math.random()<.65?candidates[Math.floor(Math.random()*candidates.length)]:null;let f=floor[Math.floor(Math.random()*floor.length)];b.path=route(b,r||tile(f.x,f.y));if(!b.path.length)b.wait=.5;}if(b.path.length){let t=b.path[0],d=dist(b,t),v=110*dt;if(d<=v){b.x=t.x;b.y=t.y;b.path.shift();}else move(b,(t.x-b.x)/d*v,(t.y-b.y)/d*v);}}check();}
function hud(){let p=game.units[0],done=game.tasks.filter(t=>t.done).length,r=rooms.map(r=>({...r,...tile(r.x,r.y)})).sort((a,b)=>dist(p,a)-dist(p,b))[0];$('identity').textContent=(p.agent?'STÖRSIGNAL':'TECHNIK')+(p.active?'':' · Zuschauer');$('area').textContent=r.name;$('progress').textContent='Systeme '+done+'/'+game.tasks.length;$('alarm').textContent=game.alarm?'⚠ Systemfehler '+Math.ceil(game.alarm)+' s':'System stabil';$('alarm').className=game.alarm?'warn':'tag';$('signal').hidden=$('disable').hidden=!p.agent;$('signal').disabled=!!game.alarm||!p.active;$('disable').disabled=p.cool>0||!p.active;$('disable').textContent='Deaktivieren [F]'+(p.cool>0?' '+Math.ceil(p.cool)+'s':'');$('meet').disabled=!p.active||!game.meetings;$('use').disabled=!p.active;$('hint').textContent=game.alarm?'Störung am Energiekern beheben.':p.active?'WASD / Pfeiltasten · E für nahe Stationen oder Meldungen · R für Stationsrat':'Zuschauermodus: frei bewegen.';}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function polygon(points,c){ctx.fillStyle=c;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill();}
function world(){let p=game.units[0];let bounds=canvas.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1),w=bounds.width,h=bounds.height;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}view={w,h};ctx.setTransform(dpr,0,0,dpr,0,0);rect(0,0,w,h,'#080f19');cam.z=clamp(Math.min(w/640,h/420),.55,1.4);cam.x=w/2-p.x*cam.z;cam.y=h/2-p.y*.76*cam.z;ctx.save();ctx.translate(cam.x,cam.y);ctx.scale(cam.z,cam.z*.76);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){let a=x*T,b=y*T;if(open(x,y)){rect(a,b,T,T,(x+y)%2?'#223b49':'#29434f');ctx.strokeStyle='#354e5a';ctx.strokeRect(a+2,b+2,T-4,T-4);rect(a+8,b+T-8,15,2,'#46636a');}else{rect(a,b,T,T,'#101b28');if(open(x,y+1)){rect(a,b+T-16,T,16,'#3f5668');rect(a,b+T-19,T,4,'#71919f');rect(a+4,b+T-12,T-8,3,'#192a36');}if(open(x+1,y))rect(a+T-6,b,6,T,'#344c5b');}}
for(let r of rooms){let t=tile(r.x,r.y);ctx.fillStyle='#839da8';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText(r.name,t.x,t.y-25);}
const objects=[...game.tasks.map(t=>({...t,kind:'task'})),...game.disabled.filter(d=>!d.reported).map(d=>({...d,kind:'off'})),...game.units.filter(u=>u.active||u.id===0).map(u=>({...u,kind:'unit'}))].sort((a,b)=>a.y-b.y);
for(let o of objects){let x=o.x,y=o.y;if(o.kind==='task'){rect(x-20,y-16,40,28,'#0d1b29');rect(x-18,y-24,36,26,'#486475');rect(x-14,y-20,28,16,o.done?'#5fbd94':'#d5aa62');rect(x-11,y-16,18,3,'#163f4b');rect(x-18,y+4,36,6,'#192d3d');}else if(o.kind==='off'){rect(x-13,y-7,26,14,'#415565');rect(x-8,y-3,16,5,'#e9a159');}else{ctx.save();if(!o.active)ctx.globalAlpha=.45;ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(x,y+8,17,9,0,0,Math.PI*2);ctx.fill();rect(x-10,y-3,7,13,'#172431');rect(x+3,y-3,7,13,'#172431');polygon([[x-14,y-22],[x-9,y-30],[x+9,y-30],[x+14,y-22],[x+11,y-1],[x-11,y-1]],o.color);rect(x-10,y-20,20,10,'#132c3a');rect(x-7,y-17,5,4,'#a2efff');rect(x+2,y-17,5,4,'#a2efff');rect(x-4,y-28,8,3,'#d8e8ee');ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillStyle='#ecf8fc';ctx.fillText(o.name,x,y-35);ctx.restore();}}
ctx.restore();if(p.active){let r=game.alarm?110:220;let g=ctx.createRadialGradient(w/2,h/2,r*.22,w/2,h/2,r*cam.z+70);g.addColorStop(0,'#070d1800');g.addColorStop(.72,'#070d1820');g.addColorStop(1,'#070d18d9');rect(0,0,w,h,g);}}
function loop(now){if(!game)return;let dt=last?Math.min(.045,(now-last)/1000):0;last=now;if(!paused&&!game.ended)tick(dt);world();hud();frame=requestAnimationFrame(loop);}
$('start').onclick=start;$('quit').onclick=quit;$('use').onclick=use;$('signal').onclick=signal;$('disable').onclick=disable;$('meet').onclick=()=>meeting(false);
addEventListener('keydown',e=>{if(!game||paused||e.target.matches('button,select,input'))return;let k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright','e','q','f','r'].includes(k))e.preventDefault();keys.add(k);if(!e.repeat){if(k==='e')use();if(k==='q')signal();if(k==='f')disable();if(k==='r')meeting(false);}});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());document.addEventListener('visibilitychange',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k);};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(k);});
</script></body></html>
