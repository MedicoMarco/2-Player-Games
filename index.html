  OL.err='';

  olRender();return true;
}

async function olIn(u){
  if(OL.me===u.uid&&OL.unl)return;
  OL.me=u.uid;
  let p=(await OL.db.ref('users/'+u.uid).once('value')).val();
  if(!p){await new Promise(r=>setTimeout(r,900));p=(await OL.db.ref('users/'+u.uid).once('value')).val()}
  OL.name=p?p.name:String(u.email||'?').split('@')[0];OL.stats=(p&&p.stats)||{};
  try{localStorage.setItem('2pg_ol','1')}catch(e){}
  olPresence();olListen();olRender();olBadge();
}
function olGone(){
  if(OL.unl)OL.unl();OL.unl=null;OL.me=null;OL.name='';OL.P={};OL.F={};OL.RQ={};OL.INV={};OL.sent={};
  olBadge();olRender();$('#oli').innerHTML='';
}

function olPresence(){
  const me=OL.me,r=OL.db.ref('presence/'+me);
  OL.db.ref('.info/connected').on('value',s=>{
    if(s.val()===true&&OL.me===me){r.onDisconnect().remove();r.set({name:OL.name,ts:olTS(),g:OL.sess?OL.sess.gid:null})}
  });
}
const olSetGame=g=>{if(OL.me)OL.db.ref('presence/'+OL.me+'/g').set(g||null)};

function olListen(){
  const d=OL.db,me=OL.me,offs=[];
  const on=(p,f)=>{const r=d.ref(p);r.on('value',s=>f(s.val()||{}));offs.push(()=>r.off())};
  on('presence',v=>{OL.P=v;olUpd()});
  on('friends/'+me,v=>{OL.F=v;olNames(Object.keys(v));olUpd()});
  on('requests/'+me,v=>{OL.RQ=v;olUpd();olBadge()});
  on('invites/'+me,v=>{OL.INV=v;olInvites();olBadge()});
  offs.push(()=>d.ref('.info/connected').off());
  OL.unl=()=>offs.forEach(f=>f());
}
function olNames(ids){

    OL.U[i]={name:'…'};
    OL.db.ref('users/'+i).once('value').then(s=>{OL.U[i]=s.val()||{name:'?'};olUpd()}).catch(()=>{delete OL.U[i]});

async function olAuth(mode,name,pw){
  name=(name||'').trim();
  if(!/^[A-Za-z0-9_-]{3,16}$/.test(name))return OL.err='Name: 3–16 Zeichen (Buchstaben, Zahlen, _ und -).',olRender();
  if((pw||'').length<6)return OL.err='Das Passwort braucht mindestens 6 Zeichen.',olRender();
  OL.busy=1;OL.err='';olRender();
  try{
    if(mode=='login'){await OL.auth.signInWithEmailAndPassword(olMail(name),pw)}
    else{
      const low=name.toLowerCase();
      if((await OL.db.ref('names/'+low).once('value')).exists())throw{code:'auth/email-already-in-use'};
      OL.reg=1;
      const cr=await OL.auth.createUserWithEmailAndPassword(olMail(name),pw),uid=cr.user.uid;
      try{await OL.db.ref().update({['names/'+low]:uid,['users/'+uid]:{name,lower:low,created:olTS()}})}
      catch(e){try{await cr.user.delete()}catch(_){}throw{code:'auth/email-already-in-use'}}
      OL.reg=0;await olIn(cr.user);
    }
  }catch(e){OL.reg=0;OL.err=olMsg(e)}
  OL.busy=0;olRender();
}

async function olInvite(u,gid,t){

/* ---- Match: Host rechnet das Spiel und streamt das Canvas-Video, Gast sendet nur Eingaben ---- */
const olSend=(ch,o)=>{try{if(ch&&ch.readyState=='open')ch.send(JSON.stringify(o))}catch(e){}};
function olIce(ss,v,from){
  const l=v.ice&&v.ice[from];if(!l)return;
  for(const k in l){if(ss.seen[k])continue;ss.seen[k]=1;ss.pend.push(l[k])}
  olFlush(ss);
}
/* Chrome startet Video mit ~300 kbit/s und baut die Auflösung nur langsam auf – für das Spielbild gleich hoch starten */
function olBoost(d){
  try{
    const L=d.sdp.split('\r\n'),out=[],P='x-google-start-bitrate=2500;x-google-min-bitrate=1200;x-google-max-bitrate=4000';
    let v=0;
    L.forEach(l=>{
      if(l.startsWith('m='))v=l.startsWith('m=video');
      const f=/^a=fmtp:(\d+) (.*)$/.exec(l);
      if(v&&f&&!/apt=/.test(f[2])){out.push(l+';'+P);return}
      out.push(l);
      const r=/^a=rtpmap:(\d+) (VP8|VP9|H264|AV1)\//.exec(l);
      if(v&&r&&!L.some(x=>x.startsWith('a=fmtp:'+r[1]+' ')))out.push('a=fmtp:'+r[1]+' '+P);
    });
    return {type:d.type,sdp:out.join('\r\n')};
  }catch(e){return d}
}
function olFlush(ss){if(!ss.ready)return;while(ss.pend.length)ss.pc.addIceCandidate(ss.pend.shift()).catch(()=>{})}

function olNew(role,mid,gid,names,t){
  const ss=OL.sess={role,mid,gid,names,t,seen:{},pend:[],ready:0,live:0,again:[0,0],keys:{}};
  ss.pc=new RTCPeerConnection({iceServers:OL_ICE});
  ss.ref=OL.db.ref('matches/'+mid);
  ss.pc.onicecandidate=e=>{if(e.candidate)ss.ref.child('ice/'+(role?'g':'h')).push(e.candidate.toJSON())};
  ss.pc.onconnectionstatechange=()=>{
    const st=ss.pc.connectionState;if(OL.sess!==ss)return;
    if(st=='failed')ss.live?olOppLeft('Die Verbindung wurde unterbrochen.'):olLeave('Verbindung fehlgeschlagen. Möglicherweise blockiert das Netzwerk direkte Verbindungen (TURN-Server nötig).');
    else if(st=='disconnected'){clearTimeout(ss.dc);ss.dc=setTimeout(()=>{if(OL.sess===ss&&ss.pc.connectionState!='connected')ss.live?olOppLeft('Die Verbindung wurde unterbrochen.'):olLeave('Verbindung fehlgeschlagen.')},6000)}
  };
  ss.to=setTimeout(()=>{if(OL.sess===ss&&!ss.live)olLeave('Verbindung fehlgeschlagen. Möglicherweise blockiert das Netzwerk direkte Verbindungen (TURN-Server nötig).')},25000);
  OL.db.ref('matches/'+mid).onDisconnect().remove();
  olSetGame(gid);olClose();olCards();
  return ss;
}

/* ---- Host (Spieler 1, blau, links) ---- */
async function olHost(o,m){
  const names=[OL.name,olNameOf(o.uid)],ss=olNew(0,o.mid,o.gid,names,o.t);
  ON={role:0,names,cols:olCols(ocI(),m.gc).map(i=>PAL[i].c),s0:{cpu:S.cpu,t:S.t},send:x=>olSend(ss.ctl,x),fin:w=>olFin(w),leave:()=>olLeave()};
  S.cpu=0;S.t=o.t;n1=names[0];skin();document.body.classList.add('onl');
  try{
    const st=cv.captureStream(60),tr=st.getVideoTracks()[0];try{tr.contentHint='motion'}catch(e){}
    ss.snd=ss.pc.addTrack(tr,st);
    ss.ctl=ss.pc.createDataChannel('ctl');ss.mv=ss.pc.createDataChannel('mv',{ordered:false,maxRetransmits:0});
    ss.ctl.onmessage=ss.mv.onmessage=e=>{try{olHostMsg(JSON.parse(e.data))}catch(x){}};
    ss.ctl.onopen=olLive;
    ss.ref.on('value',async s=>{
      const v=s.val();if(!v||OL.sess!==ss||ss.live)return;
      if(v.answer&&!ss.ans){ss.ans=1;await ss.pc.setRemoteDescription(olBoost(JSON.parse(v.answer)));ss.ready=1;olFlush(ss)}
      olIce(ss,v,'g');
    });
    await ss.pc.setLocalDescription(await ss.pc.createOffer());
    await ss.ref.child('offer').set(JSON.stringify(ss.pc.localDescription));
  }catch(e){olLeave('Verbindung konnte nicht aufgebaut werden.')}
}
function olLive(){
  const ss=OL.sess;if(!ss||ss.live)return;
  ss.live=1;clearTimeout(ss.to);ss.ref.off();OL.db.ref('matches/'+ss.mid).onDisconnect().cancel();ss.ref.remove().catch(()=>{});
  try{const p=ss.snd.getParameters();p.encodings=[{maxBitrate:3500000,maxFramerate:60}];ss.snd.setParameters(p).catch(()=>{})}catch(e){}
  olCards();olRound();
}
function olRound(){
  const ss=OL.sess;if(!ss||ss.dead)return;clearTimeout(ss.cd);ss.again=[0,0];
  gdef=GAMES.find(g=>g.id==ss.gid);window.RX='';over=0;PA=[];TBw=-1;setView();cur=gdef.mk();
  $('#menu').style.display='none';$('#game').style.display='block';fsOn();$('#gt').textContent=gdef.n;$('#hint').textContent='';cs();
  idle=1;t0=now();let n=3;
  const tick=()=>{
    if(OL.sess!==ss)return;
    showOv(`<div class=kick>Online-Match</div><h2>${olEsc(gdef.n)}</h2><p style="font-size:18px"><b style="color:${B}">${olEsc(n1)}</b> (Spieler 1, links) gegen <b style="color:${R}">${olEsc(n2())}</b> (Spieler 2, rechts)</p><p style="opacity:.85;max-width:560px;font-size:14px">${olEsc(gdef.h)}</p><p style="font-size:64px;font-weight:800;margin:0">${n||'Los!'}</p>`);
    if(n--<=0){ss.cd=setTimeout(()=>{if(OL.sess===ss)go()},500);return}
    ss.cd=setTimeout(tick,900);
  };
  tick();
}
function olHostMsg(m){
  const ss=OL.sess;if(!ss||ss.role)return;
  if(m.k!==undefined)rKey(String(m.k),m.d?1:0);
  else if(m.p){
    const id='g'+m.i,x=cl(+m.x||0,-60,W+60),y=cl(+m.y||0,-60,H+60);
    if(m.p=='d')pDown(1,id,x,y);else if(m.p=='m')pMove(1,id,x,y,!!m.mo);else if(m.p=='u'){pMove(1,id,x,y,false);pUp(1,id)}
  }else if(m.a=='again')olAgain(1);
  else if(m.bye)olOppLeft(olEsc(ss.names[1])+' hat das Spiel verlassen.');
}
function olAgain(p){
  const ss=OL.sess;if(!ss||ss.role||ss.dead)return;
  ss.again[p]=1;
  if(ss.again[0]&&ss.again[1])return olRound();
  const ov=$('#ov');if(!ov.querySelector('[data-a=again]'))return;
  const w=ov.querySelector('.olwait');if(w)w.remove();
  ov.insertAdjacentHTML('beforeend',`<p class=olwait>Revanche: ${olEsc(ss.names[0])} ${ss.again[0]?'✓':'…'} · ${olEsc(ss.names[1])} ${ss.again[1]?'✓':'…'}</p>`);
  ON.send({o:ov.innerHTML});
}
function olFin(w){
  const ss=OL.sess;if(!ss)return;
  ON.send({res:w});olRecord(w==0?'d':w==1?'w':'l');
}
function olRecord(k){
  OL.stats[k]=(OL.stats[k]||0)+1;ach('online','Erstes Online-Match');
  try{OL.db.ref('users/'+OL.me+'/stats/'+k).transaction(v=>(v||0)+1)}catch(e){}
}

/* ---- Gast (Spieler 2, rot, rechts) ---- */
async function olGuest(mid,m){
  const names=[m.hn,m.gn],ss=olNew(1,mid,m.game,names,m.t);
  ON={role:1,names,cols:olCols(m.hc,m.gc).map(i=>PAL[i].c),leave:()=>olLeave()};skin();
  document.body.classList.add('onl-guest');
  const pc=ss.pc;
  pc.ontrack=e=>{const v=$('#gv');v.srcObject=e.streams[0]||new MediaStream([e.track]);const p=v.play&&v.play();p&&p.catch&&p.catch(()=>{})};
  pc.ondatachannel=e=>{
    const ch=e.channel;
    if(ch.label=='ctl'){ss.ctl=ch;ch.onmessage=ev=>{try{olGuestMsg(JSON.parse(ev.data))}catch(x){}};ch.onopen=olGuestOpen;if(ch.readyState=='open')olGuestOpen()}
    else ss.mv=ch;
  };
  ss.ref.on('value',async s=>{
    const v=s.val();if(!v||OL.sess!==ss||ss.live)return;
    if(v.offer&&!ss.got){
      ss.got=1;
      try{
        await pc.setRemoteDescription(JSON.parse(v.offer));ss.ready=1;olFlush(ss);
        await pc.setLocalDescription(await pc.createAnswer());
        await ss.ref.child('answer').set(JSON.stringify(pc.localDescription));
      }catch(e){olLeave('Verbindung konnte nicht aufgebaut werden.')}
    }
    olIce(ss,v,'h');
  });
}
function olGuestOpen(){
  const ss=OL.sess;if(!ss||ss.live)return;
  ss.live=1;clearTimeout(ss.to);ss.ref.off();OL.db.ref('matches/'+ss.mid).onDisconnect().cancel();
  $('#menu').style.display='none';$('#game').style.display='block';fsOn();$('#gt').textContent=olGameName(ss.gid);$('#hint').textContent='';
  olCards();
}
function olGuestMsg(m){
  const ss=OL.sess;if(!ss||!ss.role)return;
  if(m.tw!==undefined)pageTurn(m.tw);
  else if(m.o!==undefined){if(m.o===null)$('#ov').style.display='none';else showOv(m.o)}
  else if(m.s)snd(...m.s);
  else if(m.res!==undefined)olRecord(m.res==0?'d':m.res==2?'w':'l');
  else if(m.bye)olOppLeft(olEsc(ss.names[0])+' hat das Spiel verlassen.');
}

/* ---- Ende / Aufräumen ---- */
function olOppLeft(msg){
  const ss=OL.sess;if(!ss||ss.dead)return;ss.dead=1;clearTimeout(ss.cd);
  if(!ss.role){over=1;idle=0}
  $('#ov').innerHTML=`<div class=kick>Online-Match</div><h2>${msg}</h2><div><button class="btn r" data-a=leave>Zum Menü</button></div>`;$('#ov').style.display='flex';
}
function olLeave(msg){
  const ss=OL.sess;if(!ss)return;
  OL.sess=null;clearTimeout(ss.to);clearTimeout(ss.cd);clearTimeout(ss.dc);
  if(!ss.dead)olSend(ss.ctl,{bye:1});
  try{ss.ref.off()}catch(e){}
  try{OL.db.ref('matches/'+ss.mid).onDisconnect().cancel();if(!ss.live||!ss.role)OL.db.ref('matches/'+ss.mid).remove()}catch(e){}
  setTimeout(()=>{try{ss.pc.close()}catch(e){}},300);
  const o=ON;ON=null;TBw=9;skin();pageTurn(9);
  if(o&&o.s0){S.cpu=o.s0.cpu;S.t=o.s0.t}
  n1='Spieler 1';over=0;idle=0;
  document.body.classList.remove('onl','onl-guest');
  const v=$('#gv');try{v.srcObject=null}catch(e){}
  olSetGame(null);olCards();
  if($('#game').style.display!='none'||cur)toMenu();
  else{fsOff();menu()}
  if(msg)toast(msg.replace(/<[^>]+>/g,''));
}

/* ---- Gast-Eingabe (Video-Fläche), Overlay-Buttons, Start ---- */
(()=>{
  const gv=$('#gv'),gs=()=>OL.sess&&OL.sess.role==1&&OL.sess.live?OL.sess:null;
  const xy=e=>{const r=gv.getBoundingClientRect();let x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;const s=gs();if(s&&s.gid=='chess'&&x>162&&x<638&&y>4&&y<476){x=W-x;y=H-y}return[+x.toFixed(1),+y.toFixed(1)]};
  /* Schach online: Der Gast sieht das Brett um 180° gedreht, sodass seine Figuren unten stehen */
  {const gc=$('#gc'),g=gc.getContext('2d');const fr=()=>{requestAnimationFrame(fr);const s=gs(),on=!!s&&s.gid=='chess';document.body.classList.toggle('chessg',on);if(!on||!gv.videoWidth)return;const kx=gv.videoWidth/W,ky=gv.videoHeight/H;g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);g.translate(400,240);g.rotate(Math.PI);g.drawImage(gv,162*kx,4*ky,476*kx,472*ky,-238,-236,476,472)};fr()}
  let lm=0;
  gv.addEventListener('pointerdown',e=>{const s=gs();if(!s)return;e.preventDefault();try{gv.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=xy(e);olSend(s.ctl,{p:'d',i:e.pointerId,x,y})});
  gv.addEventListener('pointermove',e=>{const s=gs();if(!s)return;const t=performance.now();if(t-lm<14)return;lm=t;const[x,y]=xy(e);olSend(s.mv,{p:'m',i:e.pointerId,x,y,mo:e.pointerType=='mouse'?1:0})});
  const up=e=>{const s=gs();if(!s)return;const[x,y]=xy(e);olSend(s.ctl,{p:'u',i:e.pointerId,x,y})};
  gv.addEventListener('pointerup',up);gv.addEventListener('pointercancel',up);
  gv.addEventListener('contextmenu',e=>e.preventDefault());
  /* Gast: WASD/Leertaste werden zu den Tasten von Spieler 2 (Pfeile/Enter) */
  const GM={KeyA:'ArrowLeft',KeyD:'ArrowRight',KeyW:'ArrowUp',KeyS:'ArrowDown',Space:'Enter'};
  addEventListener('keydown',e=>{
    const s=gs();if(!s||e.repeat||e.ctrlKey||e.metaKey||e.altKey||!/^(Arrow|Space|Enter|Key|Digit)/.test(e.code))return;
    if(/^(Arrow|Space|Enter)/.test(e.code))e.preventDefault();
    const k=GM[e.code]||e.code;s.keys[k]=1;olSend(s.ctl,{k,d:1});
  });
  addEventListener('keyup',e=>{const s=gs();if(!s)return;const k=GM[e.code]||e.code;if(s.keys[k]){delete s.keys[k];olSend(s.ctl,{k,d:0})}});
  addEventListener('blur',()=>{const s=gs();if(!s)return;for(const k in s.keys)olSend(s.ctl,{k,d:0});s.keys={}});
})();

$('#ov').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'),s=OL.sess;if(!b||!s)return;
  if(b.dataset.a=='leave')olLeave();
  else if(b.dataset.a=='again'){if(s.role==0)olAgain(0);else{olSend(s.ctl,{a:'again'});b.textContent='Warte auf Gegner…'}}
});
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{try{if(ac&&ac.state=='suspended')ac.resume()}catch(e){}},true));
addEventListener('pagehide',()=>{if(OL.sess)olSend(OL.sess.ctl,{bye:1})});
$('#olb').onclick=olOpen;
try{if(localStorage.getItem('2pg_ol')&&olOK())setTimeout(olInit,1200)}catch(e){}
